.btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 36px;border-radius:999px;background:#26af93;color:#ffffff;font-weight:800;font-size:17px;text-decoration:none}
.btn:hover{background:#13907f;color:#ffffff}
.btn:focus-visible{outline:2px solid #26af93;outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.eyebrow{margin:0;font-size:15px;line-height:21px;font-weight:800;letter-spacing:0.04em;color:#13907f}
.h2{margin:0;font-size:34px;line-height:46px;font-weight:800;color:#1c2430;text-wrap:balance}
.lead{margin:0;font-size:17px;line-height:28px;color:#6e695d}
.card{background:#ffffff;border:1px solid #d9d4c7;border-radius:14px}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px dashed #d9d4c7;border-radius:14px;background:#ece8df;color:#6e695d;font-size:13px;line-height:19px;padding:16px}

h1,h2{font-family:'NanumSquare',Pretendard,'Noto Sans KR',sans-serif;letter-spacing:-0.02em}
body{margin:0;background:#faf8f3}
*{box-sizing:border-box}
a{color:#13907f}a:hover{color:#1c2430}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;background:#26af93;color:#ffffff;font-weight:800;font-size:17px;text-decoration:none}
.btn:hover{background:#13907f;color:#ffffff}
.btn:focus-visible{outline:2px solid #26af93;outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
.eyebrow{margin:0;font-size:13px;line-height:19px;font-weight:800;letter-spacing:0.04em;color:#13907f}
.h2{margin:0;font-size:24px;line-height:34px;font-weight:800;color:#1c2430;text-wrap:balance}
.lead{margin:0;font-size:17px;line-height:28px;color:#6e695d}
.card{background:#ffffff;border:1px solid #d9d4c7;border-radius:14px}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px dashed #d9d4c7;border-radius:14px;background:#ece8df;color:#6e695d;font-size:13px;line-height:19px;padding:16px}
summary{cursor:pointer;list-style:none;font-weight:700;font-size:16px;line-height:24px;color:#1c2430;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}
summary::after{content:"";flex:none;width:7px;height:7px;margin-right:6px;border-right:1.5px solid #6e695d;border-bottom:1.5px solid #6e695d;transform:translateY(-2px) rotate(45deg);transition:transform .2s ease}

<body>
<div id="root"></div>
<template id="tpl">
<div style="width: 100%; background: #faf8f3; color: #1c2430; font-family: 'NanumSquare', Pretendard, 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">

<section class="hero-bg" style="position: relative; overflow: hidden">

<header style="position: absolute; top: 0; left: 0; right: 0; z-index: 2; background: transparent; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(28,36,48,0.08)">
<div style="max-width: 1080px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px">
<div style="display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; row-gap: 2px">
<img src="assets/naesik_logo.svg" alt="내식대로" style="height: 30px; width: auto; display: block">
<span style="font-size: 14px; line-height: 20px; color: #4f4a40">완벽한 식단 말고, 내 식대로</span>
</div>
<a class="btn" href="#apply" style="min-height: 44px; padding: 0 22px; font-size: 14px">8주 베타 사전 신청</a>
</div>
</header>
<div style="position: relative; max-width: 1080px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; align-items: flex-end; column-gap: 48px">

<div style="flex: 1 1 480px; min-width: 0; padding: 168px 0 128px; display: flex; flex-direction: column; gap: 24px">
<p style="margin: 0; font-size: 15px; line-height: 21px; font-weight: 800; letter-spacing: 0.04em; color: #13907f; font-style: normal; font-family: 'NanumSquare', Pretendard, system-ui, -apple-system, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, sans-serif">재검을 앞둔 분을 위한 식단 기록</p>
<h1 style="margin: 0; font-size: 44px; line-height: 58px; font-weight: 800; text-wrap: balance; color: #1c2430">검진표에 <span style="background: linear-gradient(transparent 58%, rgba(38,175,147,0.32) 58%, rgba(38,175,147,0.32) 92%, transparent 92%); padding: 0 4px; margin: 0 -2px; -webkit-box-decoration-break: clone; box-decoration-break: clone">LDL 콜레스테롤 187</span><br>뭐부터 해야 할지 막막했어요</h1>
<p style="margin: 0; font-size: 17px; line-height: 28px; color: #4f4a40">내식대로와 식사 사진 한 장부터 시작해요.<br>8주 뒤 재검 결과와 함께 돌아봐요.</p>
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
<a class="btn" href="#apply">8주 베타 사전 신청</a>
</div>

</div>

<div style="flex: 0 0 380px; max-width: 100%; height: 520px; overflow: visible; clip-path: inset(-120px -120px 0 -120px); margin-right: 0; display: flex; justify-content: flex-end; align-items: flex-start; padding-top: 32px; width: 300px">
<div style="width: 360px; max-width: 100%; padding: 0; background: #faf8f3; border-radius: 24px; overflow: hidden; box-shadow: 0 32px 88px rgba(92,64,24,0.40), 0 8px 24px rgba(92,64,24,0.16)">
<img src="assets/screen_app.png" alt="내식대로 앱의 오늘 화면. 재검 채혈까지 D-1, 시작 LDL 187, 오늘의 식사 사진과 기록이 보여요." style="width: 100%; height: auto; display: block; border-radius: 24px">
</div>
</div>

</div>
</section>

<section style="padding: 88px 0; background: #ffffff; border-top: 1px solid #d9d4c7">
<div class="wrap" style="display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 12px">
<p class="eyebrow">나 같은 사람들</p>
<h2 class="h2">오픈채팅방에서 비슷한 고민을<br>가진 사람들을 만났어요</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<figure class="card" style="flex: 1 1 280px; margin: 0; padding: 40px 36px; display: flex; flex-direction: column; gap: 16px; background: #faf5e9; border: none">
<blockquote style="margin: 0; font-size: 20px; line-height: 32px; font-weight: 400"><span style="font-weight: normal">“멀쩡히 살다 건강검진에서 LDL 172를 받고 멘붕이었어요. 의사 선생님과 상의해서 식단부터 바꿔 보는 중이에요”</span></blockquote>
<figcaption style="font-size: 13px; line-height: 19px; color: #6e695d">검진에서 처음 알게 된 분</figcaption>
</figure>
<figure class="card" style="flex: 1 1 280px; margin: 0; padding: 40px 36px; display: flex; flex-direction: column; gap: 16px; background: #faf5e9; border: none">
<blockquote style="margin: 0; font-size: 20px; line-height: 32px; font-weight: 400"><span style="font-weight: normal">“20대부터 LDL이 200을 넘었어요. 가족력이라 치료 받으면서도, 내 노력이 조금이라도 보탬이 되는지 확인하고 싶어요”</span></blockquote>
<figcaption style="font-size: 13px; line-height: 19px; color: #6e695d">가족력이 있는 분</figcaption>
</figure>
<figure class="card" style="flex: 1 1 280px; margin: 0; padding: 40px 36px; display: flex; flex-direction: column; gap: 16px; background: #faf5e9; border: none">
<blockquote style="margin: 0; font-size: 20px; line-height: 32px; font-weight: 400"><span style="font-weight: normal">“약 부작용으로 두 달간 고생하며 힘든 시간을 보냈어요. 지금은 의사와 상의하면서 식단과 운동으로 관리하고 있어요”</span></blockquote>
<figcaption style="font-size: 13px; line-height: 19px; color: #6e695d">약 부작용을 겪은 분</figcaption>
</figure>
</div>
</div>
</section>

<section style="padding: 88px 0; background: #e9faf3">
<div class="wrap" style="display: flex; flex-direction: column; align-items: center; gap: 40px; text-align: center">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 760px">
<p class="eyebrow">공통된 마음</p>
<h2 class="h2">약을 먹든 안 먹든,<br>내 생활로 할 수 있는 건 해보고 싶었어요</h2>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; width: 100%">
<div class="card" style="flex: 1 1 260px; padding: 32px 24px; font-size: 20px; line-height: 32px; border: none"><img src="assets/mind_1.png" alt="돋보기와 체크리스트를 든 내식대로 캐릭터" style="display: block; height: 140px; width: auto; margin: 0 auto 20px"><span style="font-weight: 400">내 상태와 생활에 맞춰<br><strong style="background: linear-gradient(transparent 58%, rgba(38,175,147,0.32) 58%, rgba(38,175,147,0.32) 92%, transparent 92%)">관리하고 싶은 마음</strong></span></div>
<div class="card" style="flex: 1 1 260px; padding: 32px 24px; font-size: 20px; line-height: 32px; border: none"><img src="assets/mind_2.png" alt="돋보기로 오르는 그래프를 살펴보는 내식대로 캐릭터" style="display: block; height: 140px; width: auto; margin: 0 auto 20px"><span style="font-weight: 400">생활을 바꾸면 뭐가 달라지는지<br><strong style="background: linear-gradient(transparent 58%, rgba(38, 175, 147, 0.32) 58%, rgba(38, 175, 147, 0.32) 92%, transparent 92%)">확인하고 싶은 마음</strong></span></div>
<div class="card" style="flex: 1 1 260px; padding: 32px 24px; font-size: 20px; line-height: 32px; border: none"><img src="assets/mind_3.png" alt="스스로를 안아 주는 내식대로 캐릭터" style="display: block; height: 140px; width: auto; margin: 0 auto 20px"><span style="display: block; font-weight: 400">내 건강을<br><strong style="background: linear-gradient(transparent 58%, rgba(38,175,147,0.32) 58%, rgba(38,175,147,0.32) 92%, transparent 92%)">스스로 챙기고 싶은 마음</strong></span></div>
</div>
</div>
</section>

<section style="padding: 88px 0 120px; background: #ffffff">
<div class="wrap" style="display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 12px">
<p class="eyebrow">고민과 해결</p>
<h2 class="h2">그런데 막상 해보니, 이 세 가지가 어려웠어요</h2>
</div>

<div style="display: flex; flex-direction: column; gap: 40px">
<div data-stack="1" style="position: sticky; top: 96px; transform-origin: 50% 0; will-change: transform; background: #faf5e9; border-radius: 28px; padding: 56px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px; min-height: 540px">
<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; align-self: flex-start; padding: 6px 16px; border: 1px solid #f2a46e; border-radius: 999px; background: #fff1e7; font-size: 15px; line-height: 20px; font-weight: 800; color: var(--red, #c1381b)">고민 1</p>
<p style="margin: 0; font-size: 20px; line-height: 32px; font-weight: 700; color: var(--red, #c1381b)">“식단 기록은 오래 못 가요.<br>매번 적는 게 귀찮거든요”</p>
</div>
<div style="width: 40px; height: 2px; background: #26af93"></div>
<div style="display: flex; flex-direction: column; gap: 12px">

<h3 style="margin: 0; font-family: 'NanumSquare', Pretendard, 'Noto Sans KR', sans-serif; font-size: 32px; line-height: 44px; font-weight: 800; letter-spacing: -0.02em; color: #1c2430">먹기 전에 사진 한 장,<br>뭘 먹었는지 AI가 정리해요</h3>
<p style="margin: 0; font-size: 17px; line-height: 28px; color: #4f4a40; max-width: 420px">음식 이름을 하나하나 입력할 필요 없고, <br>잘못 인식한 음식은 직접 수정할 수 있어요.</p>
</div>
</div>
<div style="flex: 1 1 400px; min-width: 0; display: flex; justify-content: center; align-items: center">
<div style="width: 380px; max-width: 100%; background: #fffefa; border: 1px solid #e3ded2; border-radius: 24px; overflow: hidden; box-shadow: 0 6px 18px rgba(92,64,24,0.07); text-align: left">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid #ece8df">
<img src="assets/naesik_logo.svg" alt="내식대로" style="height: 24px; width: auto; display: block">
<span style="font-size: 13px; line-height: 18px; color: #6e695d">미리보기</span>
</div>
<div style="padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 8px"><svg width="24" height="24" viewBox="2 2.5 28 28" fill="#c2561b" aria-hidden="true" style="fill: var(--red, #c1381b)"><path d="M16,12a6,6,0,1,0,6,6A6,6,0,0,0,16,12Zm0,10a4,4,0,1,1,4-4A4,4,0,0,1,16,22Z"></path><path d="M25,12H24a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Z"></path><path d="M27,8H23a3,3,0,0,0-3-3H12A3,3,0,0,0,9,8H5a3,3,0,0,0-3,3V25a3,3,0,0,0,3,3H27a3,3,0,0,0,3-3V11A3,3,0,0,0,27,8Zm1,17a1,1,0,0,1-1,1H5a1,1,0,0,1-1-1V11a1,1,0,0,1,1-1h5a1,1,0,0,0,1-1V8a1,1,0,0,1,1-1h8a1,1,0,0,1,1,1V9a1,1,0,0,0,1,1h5a1,1,0,0,1,1,1Z"></path></svg><p style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 800; color: var(--red, #c1381b)">오늘 점심</p></div>
<img src="assets/lunch.jpg" alt="오늘 점심 사진. 흑미밥, 고등어구이, 채소 샐러드, 브로콜리, 당근이 한 접시에 담겨 있어요." style="width: 100%; height: 190px; object-fit: cover; display: block; border-radius: 12px">
<div style="background: #f4f2ec; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{ mealAsk }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 17px; line-height: 24px; font-weight: 800; color: #1c2430">이렇게 나눴어요. 맞나요?</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ mealChips }}" as="c" hint-placeholder-count="3"><span style="padding: 6px 14px; border-radius: 999px; background: #e3eee9; color: #2f4a40; font-size: 14px; line-height: 20px">{{ c.label }}</span></sc-for></div>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{ confirmMeal }}" style="flex: 1 1 0; min-height: 48px; border: 0; border-radius: 12px; background: #26af93; color: #ffffff; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>맞아요</button>
<button type="button" onClick="{{ editMeal }}" style="flex: 1 1 0; min-height: 48px; border: 1px solid #d9d4c7; border-radius: 12px; background: #fffefa; color: #1c2430; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer">고칠게요</button>
</div>

<script>
class DCLogic{constructor(){this.state={}}setState(p){Object.assign(this.state,p);render()}}

class Component extends DCLogic {
componentDidMount() {
this._onScroll = () => {
if (this._raf) return;
this._raf = requestAnimationFrame(() => {
this._raf = null;
const cards = Array.from(document.querySelectorAll('[data-stack]'));
const tops = cards.map((c) => c.getBoundingClientRect().top);
const cover = cards.map((c, j) => {
if (j === 0) return 0;
const h = cards[j - 1].offsetHeight || 1;
return Math.min(1, Math.max(0, 1 - (tops[j] - tops[j - 1]) / h));
});
cards.forEach((card, i) => {
let depth = 0;
for (let j = i + 1; j < cards.length; j++) depth += cover[j];
card.style.transform = depth > 0 ? 'scale(' + (1 - 0.04 * depth).toFixed(4) + ')' : '';
card.style.filter = depth > 0 ? 'brightness(' + (1 - 0.06 * depth).toFixed(4) + ')' : '';
card.style.boxShadow = cover[i] > 0 ? '0 -16px 40px rgba(92,64,24,' + (0.14 * cover[i]).toFixed(3) + ')' : 'none';
});
});
};
document.addEventListener('scroll', this._onScroll, true);
window.addEventListener('resize', this._onScroll);
this._onScroll();
}
componentWillUnmount() {
document.removeEventListener('scroll', this._onScroll, true);
window.removeEventListener('resize', this._onScroll);
if (this._raf) cancelAnimationFrame(this._raf);
}

submitApply(e, page) {
const APPLY_URL = 'https://script.google.com/macros/s/AKfycbxUHA8-LGm_iytNHcABvuNzwFqBChcoHUL6jjMvXUHmUcGPoYbyyikngde1RXuDQrw0Vg/exec';
if (e && e.preventDefault) e.preventDefault();
if ((this.state || {}).applySending) return;
const f = (e && e.currentTarget && e.currentTarget.elements) ? e.currentTarget : document.querySelector('form[data-apply]');
if (!f) return;
const get = (n) => { const el = f.elements[n]; if (!el) return ''; return el.type === 'checkbox' ? el.checked : String(el.value || '').trim(); };
const data = { name: get('name'), email: String(get('email')).toLowerCase(), retest: get('retest'), habit: get('habit'), agree: get('agree'), website: get('website') };
let err = '';
if (!data.name) err = '이름을 입력해 주세요.';
else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) err = '이메일 주소를 다시 확인해 주세요.';
else if (!data.retest) err = '재검 예정 시기를 선택해 주세요.';
else if (!data.habit) err = '내 식습관을 선택해 주세요.';
else if (!data.agree) err = '개인정보 수집 및 이용에 동의해 주세요.';
if (err) { this.setState({ applyError: err }); return; }
const q = new URLSearchParams(window.location.search);
data.agreedAt = new Date().toISOString();
data.utmSource = q.get('utm_source') || '';
data.utmMedium = q.get('utm_medium') || '';
data.utmCampaign = q.get('utm_campaign') || '';
data.referrer = document.referrer || '';
data.page = page;
if (!APPLY_URL) { this.setState({ applyError: '신청 주소가 아직 연결되지 않았어요.' }); return; }
const fail = () => this.setState({ applySending: false, applyError: '신청을 보내지 못했어요. 잠시 후 다시 시도해 주세요.' });
this.setState({ applySending: true, applyError: '' });
fetch(APPLY_URL, { method: 'POST', body: JSON.stringify(data) })
.then((r) => r.json())
.then((res) => {
if (res && res.ok) this.setState({ applySending: false, applyDone: true });
else if (res && res.code === 'duplicate') this.setState({ applySending: false, applyError: '이미 신청한 이메일이에요.' });
else fail();
})
.catch(fail);
}
renderVals() {
const st = this.state || {};
const allTags = ['채소', '통곡물', '생선', '콩·두부', '육류', '튀김'];
const tags = st.tags || ['채소', '통곡물', '생선'];
const meal = st.meal || 'ask';
const days = st.days || [true, true, false, true, true, false, true, true, false, true, true, true, false, true];
const chipBase = 'padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 14px; line-height: 20px; cursor: pointer; ';
const dayBase = 'aspect-ratio: 1 / 1.05; border-radius: 12px; font: inherit; font-size: 13px; line-height: 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; ';
return {
mealAsk: meal === 'ask', mealEdit: meal === 'edit', mealOk: meal === 'ok',
mealChips: tags.map((t) => ({ label: t })),
mealOptions: allTags.map((t) => {
const on = tags.indexOf(t) >= 0;
return { label: t, style: chipBase + (on ? 'border: 1px solid #26af93; background: #26af93; color: #ffffff; font-weight: 700' : 'border: 1px solid #d9d4c7; background: #fffefa; color: #4f4a40'),
toggle: () => this.setState({ tags: on ? tags.filter((x) => x !== t) : tags.concat([t]) }) };
}),
confirmMeal: () => this.setState({ meal: 'ok' }),
editMeal: () => this.setState({ meal: 'edit' }),
days: days.map((on, i) => ({ n: i + 1, on: on, pressed: on ? 'true' : 'false',
style: dayBase + (on ? 'border: 0; background: #26af93; color: #ffffff' : 'border: 0; background: #ece8df; color: #8a8478'),
toggle: () => { const next = days.slice(); next[i] = !next[i]; this.setState({ days: next }); } })),
doneCount: days.filter(Boolean).length,
ldlPrev: st.ldlPrev != null ? st.ldlPrev : '178',
ldlNow: st.ldlNow != null ? st.ldlNow : '',
question: st.question != null ? st.question : '제 기록에서 어떤 점을 더 살펴보면 좋을까요?',
setPrev: (e) => this.setState({ ldlPrev: e.target.value.replace(/[^0-9]/g, '').slice(0, 3) }),
setNow: (e) => this.setState({ ldlNow: e.target.value.replace(/[^0-9]/g, '').slice(0, 3) }),
setQuestion: (e) => this.setState({ question: e.target.value }),
privacyOpen: !!st.privacyOpen,
openPrivacy: (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } this.setState({ privacyOpen: true }); },
closePrivacy: () => this.setState({ privacyOpen: false }),
applyDone: !!st.applyDone,
applySending: !!st.applySending,
applyError: st.applyError || '',
submitLabel: st.applySending ? '보내는 중…' : '사전 신청하기',
submitApply: (e) => this.submitApply(e, '데스크톱'),
stopClick: (e) => { if (e) e.stopPropagation(); }
};
}
}

const y = window.scrollY;

clearTimeout(this._settleT);

const target = Math.round(next.getBoundingClientRect().top + y - (head ? head.offsetHeight : 0));
let to = null;
if (this._atTop && y > this._lastY && y > 2 && y < target - 8) to = target;
else if (y < this._lastY && this._lastY >= target - 8 && y > 8 && y < target - 8) to = 0;
this._lastY = y;
if (y > 8) this._atTop = false;
if (to === null) return;
this._snapping = true;
this._atTop = false;
window.scrollTo({ top: to, behavior: 'smooth' });
clearTimeout(this._snapT);
this._snapT = setTimeout(() => { this._snapping = false; this._lastY = window.scrollY; }, 800);
};
window.addEventListener('scroll', this._onSnap, { passive: true });
}
componentWillUnmount() {
window.removeEventListener('scroll', this._onSnap);
clearTimeout(this._snapT);
clearTimeout(this._settleT);
document.removeEventListener('scroll', this._onScroll, true);
window.removeEventListener('resize', this._onScroll);
if (this._raf) cancelAnimationFrame(this._raf);
}

data.utmMedium = q.get('utm_medium') || '';
data.utmCampaign = q.get('utm_campaign') || '';
data.referrer = document.referrer || '';
data.page = page;
if (!APPLY_URL) { this.setState({ applyError: '신청 주소가 아직 연결되지 않았어요.' }); return; }
const fail = () => this.setState({ applySending: false, applyError: '신청을 보내지 못했어요. 잠시 후 다시 시도해 주세요.' });
this.setState({ applySending: true, applyError: '' });
fetch(APPLY_URL, { method: 'POST', body: JSON.stringify(data) })
.then((r) => r.json())
.then((res) => {
if (res && res.ok) this.setState({ applySending: false, applyDone: true });
else if (res && res.code === 'duplicate') this.setState({ applySending: false, applyError: '이미 신청한 이메일이에요.' });
else fail();
})
.catch(fail);
}
renderVals() {
const st = this.state || {};
const allTags = ['채소', '통곡물', '생선', '콩·두부', '육류', '튀김'];
const tags = st.tags || ['채소', '통곡물', '생선'];
const meal = st.meal || 'ask';
const days = st.days || [true, true, false, true, true, false, true, true, false, true, true, true, false, true];
const chipBase = 'padding: 6px 14px; border-radius: 999px; font: inherit; font-size: 14px; line-height: 20px; cursor: pointer; ';
const dayBase = 'aspect-ratio: 1 / 1.05; border-radius: 12px; font: inherit; font-size: 13px; line-height: 16px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 0; ';
return {
mealAsk: meal === 'ask', mealEdit: meal === 'edit', mealOk: meal === 'ok',
mealChips: tags.map((t) => ({ label: t })),
mealOptions: allTags.map((t) => {
const on = tags.indexOf(t) >= 0;
return { label: t, style: chipBase + (on ? 'border: 1px solid #26af93; background: #26af93; color: #ffffff; font-weight: 700' : 'border: 1px solid #d9d4c7; background: #fffefa; color: #4f4a40'),
toggle: () => this.setState({ tags: on ? tags.filter((x) => x !== t) : tags.concat([t]) }) };
}),
confirmMeal: () => this.setState({ meal: 'ok' }),
editMeal: () => this.setState({ meal: 'edit' }),
days: days.map((on, i) => ({ n: i + 1, on: on, pressed: on ? 'true' : 'false',
style: dayBase + (on ? 'border: 0; background: #26af93; color: #ffffff; padding-top: 4px' : 'border: 0; background: #ece8df; color: #8a8478'),
toggle: () => { const next = days.slice(); next[i] = !next[i]; this.setState({ days: next }); } })),
doneCount: days.filter(Boolean).length,
ldlPrev: st.ldlPrev != null ? st.ldlPrev : '178',
ldlNow: st.ldlNow != null ? st.ldlNow : '',
question: st.question != null ? st.question : '제 기록에서 어떤 점을 더 살펴보면 좋을까요?',
setPrev: (e) => this.setState({ ldlPrev: e.target.value.replace(/[^0-9]/g, '').slice(0, 3) }),
setNow: (e) => this.setState({ ldlNow: e.target.value.replace(/[^0-9]/g, '').slice(0, 3) }),
setQuestion: (e) => this.setState({ question: e.target.value }),
privacyOpen: !!st.privacyOpen,
openPrivacy: (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } this.setState({ privacyOpen: true }); },
closePrivacy: () => this.setState({ privacyOpen: false }),
applyDone: !!st.applyDone,
applySending: !!st.applySending,
applyError: st.applyError || '',
submitLabel: st.applySending ? '보내는 중…' : '사전 신청하기',
submitApply: (e) => this.submitApply(e, '모바일'),
stopClick: (e) => { if (e) e.stopPropagation(); }
};
}
}


const root=document.getElementById('root');
const mq=window.matchMedia('(max-width: 767px)');
const tplD=document.getElementById('tpl'),tplM=document.getElementById('tplm');
let tpl=mq.matches?tplM:tplD;
let comp=mq.matches?new ComponentM():new Component();
mq.addEventListener('change',()=>{comp.componentWillUnmount&&comp.componentWillUnmount();tpl=mq.matches?tplM:tplD;comp=mq.matches?new ComponentM():new Component();mounted=false;render()});
const ONE=/^\s*\{\{([\s\S]*?)\}\}\s*$/;
function ev(expr,scope){const k=Object.keys(scope);return Function(...k,'return ('+expr+');')(...k.map(x=>scope[x]))}
function proc(node,scope){
  if(node.nodeType===3){if(node.nodeValue.includes('{{'))node.nodeValue=node.nodeValue.replace(/\{\{([\s\S]*?)\}\}/g,(_,e)=>{const v=ev(e,scope);return v==null?'':v});return [node]}
  if(node.nodeType!==1)return [node];
  const tag=node.tagName.toLowerCase();
  if(tag==='sc-if'){const v=ev(node.getAttribute('value').match(ONE)[1],scope);if(!v)return [];return procKids(node,scope)}
  if(tag==='sc-for'){const list=ev(node.getAttribute('list').match(ONE)[1],scope)||[];const as=node.getAttribute('as');const res=[];list.forEach((it,i)=>{const s=Object.assign({},scope,{[as]:it});const c=node.cloneNode(true);res.push(...procKids(c,s))});return res}
  for(const a of [...node.attributes]){
    if(a.name.startsWith('hint-')){node.removeAttribute(a.name);continue}
    const mo=a.value.match(ONE);
    if(mo){const v=ev(mo[1],scope);node.removeAttribute(a.name);
      if(a.name.startsWith('on')){let evn=a.name.slice(2);if(evn==='change')evn='change';node.addEventListener(evn,v)}
      else if(a.name==='value'){node.value=v==null?'':v;if(tag==='textarea')node.textContent=v==null?'':v;else node.setAttribute('value',v==null?'':v)}
      else if(v===false||v==null){}else node.setAttribute(a.name,String(v))}
    else if(a.value.includes('{{')){node.setAttribute(a.name,a.value.replace(/\{\{([\s\S]*?)\}\}/g,(_,e)=>ev(e,scope)))}
  }
  const kids=procKids(node,scope);node.replaceChildren(...kids);if(tag==='select'){const o=[...node.options].findIndex(x=>x.hasAttribute('selected'));node.selectedIndex=o>=0?o:0}return [node]}
function procKids(node,scope){const r=[];for(const c of [...node.childNodes])r.push(...proc(c,scope));return r}
var mounted=false;
function render(){
  const saved={},open=[];
  root.querySelectorAll('input[name],select[name]').forEach(e=>{saved[e.name]=e.type==='checkbox'?e.checked:e.value});
  root.querySelectorAll('details').forEach((d,i)=>{if(d.open)open.push(i)});
  const vals=comp.renderVals();const frag=tpl.content.cloneNode(true);
  const kids=procKids(frag,vals);root.replaceChildren(...kids);
  root.querySelectorAll('input[name],select[name]').forEach(e=>{if(e.name in saved){if(e.type==='checkbox')e.checked=saved[e.name];else e.value=saved[e.name]}});
  const ds=root.querySelectorAll('details');open.forEach(i=>ds[i]&&(ds[i].open=true));
  if(!mounted){mounted=true;comp.componentDidMount&&comp.componentDidMount()}else if(comp._onScroll)comp._onScroll();
}
render();

</script>
