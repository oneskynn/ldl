<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내식대로 프로토타입 — 재검까지의 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1EC;--surface:#FFFFFF;--ink:#1F2A26;--muted:#5E6B65;--line:#D5DCD6;--accent:#2E5E4E;--accent-soft:#DCE7E1;--ldl:#9A6412;--ldl-soft:#F3E6CF;--warn:#8A3B2E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A18;--surface:#1C2421;--ink:#E6ECE8;--muted:#9AA8A1;--line:#2E3834;--accent:#7FB8A2;--accent-soft:#24362F;--ldl:#E0A955;--ldl-soft:#3A3020;--warn:#E08A7A}}
:root[data-theme="dark"]{--bg:#141A18;--surface:#1C2421;--ink:#E6ECE8;--muted:#9AA8A1;--line:#2E3834;--accent:#7FB8A2;--accent-soft:#24362F;--ldl:#E0A955;--ldl-soft:#3A3020;--warn:#E08A7A}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{padding:14px 18px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
.brand h1{display:flex;align-items:center;gap:8px}
.logo{width:28px;height:28px;flex:none}
.dday{font-size:13px;color:var(--muted)}
.dday b{color:var(--ink);font-weight:600}
nav{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;padding:10px 0 11px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
main{flex:1;min-height:0;position:relative}
section{position:absolute;inset:0;overflow-y:auto;padding:16px 18px 28px;display:none}
section.on{display:block}
#chat{padding:0;display:none;flex-direction:column}
#chat.on{display:flex}
.log{flex:1;overflow-y:auto;padding:16px 18px 8px}
.msg{width:fit-content;max-width:86%;margin:0 0 10px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.msg.ai{padding:2px 0}
.msg.me{margin-left:auto;background:var(--accent);color:var(--surface);padding:9px 13px;border-radius:16px 16px 4px 16px}
.msg.thinking{color:var(--muted)}
.saved{font-size:12.5px;color:var(--muted);margin:-4px 0 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.saved span{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px}
.saved button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0}
.lab{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ldl);border-radius:10px;padding:12px 14px;margin:0 0 14px;max-width:92%}
.lab h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--muted)}
.lab dl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 10px}
.lab dt{font-size:12px;color:var(--muted)}
.lab dd{margin:0;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.lab dd.ldl{color:var(--ldl)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.chip{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:5px 12px;font-size:13.5px}
.composer{border-top:1px solid var(--line);background:var(--surface);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.attach-pill{font-size:12.5px;color:var(--muted);margin:0 0 8px 2px;display:none;align-items:center;gap:8px}
.attach-pill.on{display:flex}
.attach-pill img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.attach-pill button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:0}
.msg.me img{display:block;width:240px;max-width:100%;height:auto;border-radius:10px;margin:2px 0 6px}
.msg.me.photo-only{padding:6px}
.msg.me.photo-only img{margin:0;width:240px;border-radius:12px 12px 2px 12px}
.icon.photo{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.composer form{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;max-height:120px;min-height:42px;line-height:1.45}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none}
.icon.send{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.icon svg{width:20px;height:20px}
.notice{font-size:13px;color:var(--warn);padding:0 4px 6px}
h2{font-size:16px;font-weight:600;margin:24px 0 10px}
h2:first-child{margin-top:4px}
.sub{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fact small{display:block;font-size:12.5px;color:var(--muted)}
.fact strong{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fact strong em{font-style:normal;font-size:13px;font-weight:400;color:var(--muted);margin-left:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1;border-radius:4px;background:var(--line);opacity:.55;position:relative}
.cell.l1{background:var(--accent);opacity:.35}
.cell.l2{background:var(--accent);opacity:.65}
.cell.l3{background:var(--accent);opacity:1}
.cell.future{background:transparent;border:1px dashed var(--line);opacity:1}
.cell.retest{outline:2px solid var(--ldl);outline-offset:1px}
.cell.today::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--muted);font-family:inherit}
.day{border-top:1px solid var(--line);padding:10px 0}
.day:first-child{border-top:0;padding-top:0}
.day b{font-weight:600;font-size:14px}
.day p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.day-photos{display:flex;gap:6px;margin:6px 0 2px;flex-wrap:wrap}
.day-photos figure{margin:0;width:88px}
.day-photos img{width:88px;height:88px;object-fit:cover;border-radius:8px;display:block}
.day-photos figcaption{font-size:11.5px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12.5px}
td:first-child,th:first-child{text-align:left}
td.down{color:var(--accent);font-weight:600}
td.up{color:var(--warn);font-weight:600}
.empty{text-align:left;padding:28px 4px;color:var(--muted)}
.empty p{margin:0 0 14px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px}
.doc h3{font-size:14px;font-weight:600;margin:18px 0 6px}
.doc h3:first-child{margin-top:0}
.doc p,.doc li{font-size:14px;margin:0 0 4px}
.doc ul{padding-left:18px;margin:0}
.doc .fine{font-size:12px;color:var(--muted);margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.narr{white-space:pre-wrap}
.q{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.q button{background:none;border:0;color:var(--muted);font-size:12.5px;padding:0;flex:none}
.guide{background:var(--ldl-soft);border-radius:10px;padding:11px 13px;margin:0 0 16px;font-size:13.5px;line-height:1.55}
.guide b{display:block;font-weight:600;margin-bottom:2px}
.guide.hide{display:none}
.chat-guide{margin:12px 18px 0}
.demo-bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.demo-bar button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12px;padding:0}
.sep{text-align:center;font-size:12px;color:var(--muted);margin:18px 0 12px}
.note{font-size:12px;color:var(--ldl);border-left:2px dashed var(--ldl);padding:1px 0 1px 9px;margin:-4px 0 14px;max-width:92%}
body.clean .note{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><h1><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FA383"/><stop offset="1" stop-color="#2C7457"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg)"/><g fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 23.5C11 15.5 15.5 9.5 23 8.5c.6 7.8-4 13.6-11.5 15z"/><path d="M11.5 23.5l6-7"/><path d="M11.5 23.5C8 21.5 7.2 17.2 9.4 13.6c2.4 1.6 3.3 4.2 2.9 7"/></g></svg>내식대로</h1><div class="dday" id="dday"></div></div>
    <div class="demo-bar"><span>시연용 임시 데이터로 채운 프로토타입입니다</span><button id="guideToggle">설명 숨기기</button></div>
    <nav role="tablist">
      <button role="tab" data-tab="chat" aria-selected="true">대화</button>
      <button role="tab" data-tab="records" aria-selected="false">기록</button>
      <button role="tab" data-tab="compare" aria-selected="false">재검 비교</button>
      <button role="tab" data-tab="summary" aria-selected="false">진료 요약</button>
    </nav>
  </header>
  <main>
    <section id="chat" class="on">
      <div class="guide chat-guide" data-g><b>대화: 모든 입력이 이루어지는 곳</b>식사는 사진, 운동과 체중은 한 줄 문장으로 보내면 AI 코치가 기록으로 정리합니다. 검사 수치만 사용자가 확인한 뒤 저장하고, 약 복용 질문에는 답하지 않고 진료 때 물어볼 질문으로 모읍니다. 주황색 점선은 심사용 설명입니다.</div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="composer">
        <div class="notice" id="notice" hidden></div>
        <div class="attach-pill" id="attachPill"></div>
        <form id="form">
          <input type="file" id="file" accept="image/*" hidden>
          <button type="button" class="icon photo" id="attachBtn" aria-label="식사 사진 올리기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="시연용 화면에서는 입력할 수 없어요" disabled></textarea>
          <button class="icon send" id="sendBtn" aria-label="보내기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
          </button>
        </form>
      </div>
    </section>
    <section id="records"></section>
    <section id="compare"></section>
    <section id="summary"></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- 유틸 ----------
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v != null) n.setAttribute(k, v); } for (const k of kids.flat()) if (k != null) n.append(k.nodeType ? k : String(k)); return n; };
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => '2026-12-12'; // 시연용 고정 날짜: 기준 검사 2026-09-17, 재검 12주 뒤 2026-12-10
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const md = s => { const d = parse(s); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const num = v => (v === null || v === undefined || v === '' || isNaN(Number(v))) ? null : Number(v);
const uid = () => Math.random().toString(36).slice(2, 10);
const toast = t => { const n = $('#toast'); n.textContent = t; n.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => n.classList.remove('on'), 1800); };

// ---------- 상태 ----------
const blank = () => ({ baseline: null, retestDate: null, retest: null, logs: {}, questions: [], chat: [], summary: null });
let S = blank();
const undoMap = new Map(); // 세션 한정 되돌리기 스냅샷
let sample = null, aiOff = false, imagesOk = false, docRef = null, attached = null, attachedThumb = null, busy = false;

function day(d) { return S.logs[d] || (S.logs[d] = { meals: [], exercise: [], weight: null }); }

async function initStore() {
  try {
    if (window.claude) {
      const [u, db] = await Promise.all([claude.use('user'), claude.use('db')]);
      const id = u ? await u.id() : null;
      if (db && id) {
        docRef = db.doc(`data/users/${id}/naesik`);
        const snap = await docRef.get();
        if (snap.exists) { S = { ...blank(), ...JSON.parse(JSON.stringify(snap.data())) }; return; }
      }
    }
  } catch (e) { docRef = null; }
  try { const raw = localStorage.getItem('naesik'); if (raw) S = { ...blank(), ...JSON.parse(raw) }; } catch (e) {}
}
function save() { return;
  clearTimeout(save.t);
  save.t = setTimeout(async () => {
    const data = JSON.parse(JSON.stringify({ ...S, chat: S.chat.slice(-40) }));
    if (docRef) { try { await docRef.set(data); return; } catch (e) {} }
    try { localStorage.setItem('naesik', JSON.stringify(data)); } catch (e) {}
  }, 600);
}

// ---------- 기간 통계 (사실만) ----------
function period() {
  if (!S.baseline) return null;
  const start = S.baseline.date;
  const end = S.retest?.date || (S.retestDate && S.retestDate < today() ? S.retestDate : today());
  const total = Math.max(1, diff(start, end) + 1);
  let recDays = 0, meals = 0, exMin = 0; const weights = [];
  for (let i = 0; i < total; i++) {
    const d = addDays(start, i), L = S.logs[d]; if (!L) continue;
    const any = L.meals.length || L.exercise.length || L.weight != null; if (any) recDays++;
    meals += L.meals.length; exMin += L.exercise.reduce((a, e) => a + (e.minutes || 0), 0);
    if (L.weight != null) weights.push({ d, kg: L.weight, i });
  }
  return { start, end, total, recDays, meals, exMin, weekly: Math.round(exMin / (total / 7)), weights };
}

// ---------- AI 프롬프트 ----------
const RULES = `당신은 '내식대로'의 기록 코치입니다. 사용자는 LDL 콜레스테롤 재검을 앞두고 생활습관을 관리합니다. 당신의 일은 대화에서 기록을 뽑아내는 것이며, 판단하거나 처방하지 않습니다.

반드시 JSON 객체 하나로만 답하세요:
{"reply":"사용자에게 할 말","actions":[...],"chips":["짧은 답장 후보", ...]}

actions 종류 (해당하는 것만, 없으면 빈 배열):
- {"type":"lab","kind":"baseline"|"retest","date":"YYYY-MM-DD","ldl":숫자|null,"hdl":숫자|null,"tg":숫자|null,"tc":숫자|null}  기준 검사면 baseline, 재검 결과면 retest. 이미 기준 검사가 저장되어 있고 그 이후 날짜라면 retest.
- {"type":"retest_date","date":"YYYY-MM-DD"}
- {"type":"meal","date":"YYYY-MM-DD","slot":"아침"|"점심"|"저녁"|"간식","text":"먹은 것 요약"}
- {"type":"exercise","date":"YYYY-MM-DD","minutes":숫자,"text":"운동 종류"}
- {"type":"weight","date":"YYYY-MM-DD","kg":숫자}
- {"type":"question","text":"진료 때 물어볼 질문"}

규칙:
1. 사용자가 말하지 않은 수치·날짜는 추측하지 말고 null 또는 생략. '어제', '지난주 금요일' 같은 표현은 오늘 날짜 기준으로 변환.
2. 운동 시간이 없으면 minutes는 추측하지 말고 exercise를 만들지 말고 몇 분이었는지 물어보세요.
3. 약을 먹을지, 끊을지, 용량 같은 질문에는 절대 권고하지 마세요. 의료진이 판단할 부분이라고 한 문장으로 말하고, 그 고민을 question 액션으로 저장하세요.
4. 진단하지 마세요. 식단은 평가하지 말고 관찰만 짧게 (예: "튀김이 들어간 날이네요").
5. reply는 2~3문장, 존댓말, 한 번에 질문은 하나만. 빠진 핵심 정보(기준 검사, 재검일)가 있으면 그것부터 물으세요.
6. chips는 사용자가 탭 한 번으로 보낼 수 있는 자연스러운 답장 0~3개, 각 15자 이내.
7. 사진이 검사 결과지면 보이는 수치를 lab으로 기록하되, 흐릿해서 확실하지 않은 숫자는 null로 두고 확인을 요청하세요.
8. 사진이 음식이면 meal 액션 하나로 기록하세요. text에는 보이는 음식을 쉼표로 나열하고(예: "현미밥, 된장찌개, 계란말이"), 튀김·가공육·크림처럼 조리 방식이 보이면 함께 적으세요. 확실하지 않은 음식은 "~로 보이는 것"이라고 적으세요.
9. 음식 사진의 slot은 사용자가 말하면 그대로, 말하지 않으면 현재 시각으로 정하세요: 05~10시 아침, 11~15시 점심, 17~22시 저녁, 그 외 간식. date는 사용자가 말하지 않으면 오늘.
10. 음식 사진을 기록한 뒤 reply에서는 무엇으로 기록했는지 한 줄로 알려주고, 틀린 게 있으면 말해달라고 하세요. 양이나 칼로리는 묻지 마세요.`;

function snapshotText() {
  const p = period(), t = today(), L = S.logs[t];
  return [
    `오늘: ${t}`,
    `현재 시각: ${new Date().getHours()}시`,
    `기준 검사: ${S.baseline ? JSON.stringify(S.baseline) : '없음'}`,
    `재검일: ${S.retestDate || '미정'}`,
    `재검 결과: ${S.retest ? JSON.stringify(S.retest) : '없음'}`,
    `오늘 기록: ${L ? JSON.stringify(L) : '없음'}`,
    p ? `기간 기록일: ${p.total}일 중 ${p.recDays}일` : ''
  ].join('\n');
}

// ---------- 액션 적용 ----------
function applyActions(actions, msg) {
  const saved = [], labs = [];
  for (const a of Array.isArray(actions) ? actions : []) {
    const d = isDate(a.date) ? a.date : today();
    if (a.type === 'lab') {
      const v = { kind: a.kind === 'retest' ? 'retest' : 'baseline', date: d, ldl: num(a.ldl), hdl: num(a.hdl), tg: num(a.tg), tc: num(a.tc), status: 'pending' };
      if ([v.ldl, v.hdl, v.tg, v.tc].some(x => x != null)) labs.push(v);
    } else if (a.type === 'retest_date' && isDate(a.date)) { S.retestDate = a.date; saved.push(`재검일 ${md(a.date)}`); }
    else if (a.type === 'meal' && a.text) { day(d).meals.push({ slot: a.slot || '식사', text: String(a.text) }); saved.push(`${md(d)} ${a.slot || '식사'}`); }
    else if (a.type === 'exercise' && num(a.minutes)) { day(d).exercise.push({ minutes: num(a.minutes), text: String(a.text || '운동') }); saved.push(`운동 ${num(a.minutes)}분`); }
    else if (a.type === 'weight' && num(a.kg)) { day(d).weight = num(a.kg); saved.push(`체중 ${num(a.kg)}kg`); }
    else if (a.type === 'question' && a.text) { S.questions.push(String(a.text)); saved.push('진료 질문'); }
  }
  msg.saved = saved; msg.labs = labs;
}

function confirmLab(msg, i) {
  const v = msg.labs[i]; v.status = 'saved';
  const rec = { date: v.date, ldl: v.ldl, hdl: v.hdl, tg: v.tg, tc: v.tc };
  if (v.kind === 'retest') S.retest = rec; else S.baseline = rec;
  S.summary = null;
  if (v.kind === 'baseline' && !S.retestDate) {
    S.chat.push({ id: uid(), role: 'assistant', content: '저장했어요. 재검은 언제로 잡혀 있나요? 대략적인 시기만 알려주셔도 돼요.', chips: ['8주 뒤', '3개월 뒤', '아직 안 정했어요'] });
  } else if (v.kind === 'baseline') {
    S.chat.push({ id: uid(), role: 'assistant', content: '저장했어요. 이제 식사는 사진만 올려주시면 제가 기록해둘게요.', chips: ['식사 사진 올리기'] });
  } else if (v.kind === 'retest') {
    S.chat.push({ id: uid(), role: 'assistant', content: '재검 결과를 저장했어요. 재검 비교 탭에서 그동안의 기록과 함께 볼 수 있어요.', chips: [] });
  }
  save(); renderAll();
}

// ---------- 대화 ----------
async function send(text) {
  toast('시연용 화면에서는 입력할 수 없어요'); return;
  text = (text || '').trim();
  if (busy || (!text && !attached)) return;
  if (text === '샘플 데이터로 둘러보기') { loadDemo(); return; }
  if (!sample || aiOff) { showNotice('이 화면에서는 AI 대화를 쓸 수 없어요. 샘플 데이터로 흐름을 둘러볼 수 있어요.'); return; }
  const file = attached; const shown = text || '식사 사진이에요';
  const me = { id: uid(), role: 'user', content: file ? `${shown}\n[사진 첨부]` : shown, thumb: file ? attachedThumb : null };
  S.chat.push(me); $('#input').value = ''; autoGrow(); setAttach(null);
  const ai = { id: uid(), role: 'assistant', content: '', thinking: true, photo: !!file };
  S.chat.push(ai); busy = true; renderChat();
  const history = S.chat.slice(0, -2).filter(m => m.content && !m.thinking).slice(-12).map(m => ({ role: m.role, content: m.content }));
  const input = [{ role: 'user', content: RULES + '\n\n[현재 상태]\n' + snapshotText() }, ...history, { role: 'user', content: shown }];
  try {
    const opts = { cache: false, modelTier: 'quick' };
    if (file) opts.images = [file];
    const res = await sample.json(input, opts);
    const before = JSON.stringify({ ...S, chat: undefined });
    ai.content = String(res?.reply || '기록했어요.'); ai.chips = Array.isArray(res?.chips) ? res.chips.slice(0, 3).map(String) : [];
    applyActions(res?.actions, ai);
    if (ai.saved.length) undoMap.set(ai.id, before);
    if (ai.saved.length) S.summary = null;
  } catch (e) {
    S.chat.pop();
    const c = e?.code;
    if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { aiOff = true; showNotice('AI 대화 사용이 허용되지 않았어요. 샘플 데이터로 흐름을 둘러볼 수 있어요.'); }
    else if (c === 'rate_limited') showNotice('요청이 몰렸어요. 잠시 뒤 다시 보내주세요.');
    else if (c === 'invalid_json') showNotice('답을 기록으로 정리하지 못했어요. 한 번 더 보내주세요.');
    else if (c === 'image_rejected') showNotice('사진을 읽지 못했어요. JPG나 PNG로 다시 첨부해주세요.');
    else if (c === 'images_unavailable') { imagesOk = false; showNotice('지금 여신 화면에서는 사진 분석이 지원되지 않아요. PC 웹 브라우저의 claude.ai에서 열거나, 먹은 음식을 글로 적어주세요.'); }
    else showNotice('연결이 끊겼어요. 다시 보내주세요.');
    ai.thinking = false;
  } finally { ai.thinking = false; busy = false; save(); renderAll(); }
}

function undo(msg) {
  const before = undoMap.get(msg.id); if (!before) return;
  const chat = S.chat; S = { ...blank(), ...JSON.parse(before), chat }; msg.undone = true; undoMap.delete(msg.id);
  save(); renderAll(); toast('기록을 되돌렸어요');
}

function showNotice(t) { const n = $('#notice'); n.textContent = t; n.hidden = false; clearTimeout(showNotice.t); showNotice.t = setTimeout(() => n.hidden = true, 6000); }

function renderChat() {
  const log = $('#log'); log.textContent = '';
  if (!S.chat.length) {
    S.chat.push({ id: uid(), role: 'assistant', content: '재검까지 어떻게 관리했는지 함께 기록해둘게요.\n먼저 최근 받은 검사 결과를 알려주세요. 결과지 숫자를 그대로 적거나 사진을 올려도 돼요.\n예: 3월 5일 검사, LDL 178 HDL 52', chips: ['결과지 사진 올릴게요', '아직 결과지가 없어요', '샘플 데이터로 둘러보기'] });
  }
  const last = S.chat[S.chat.length - 1];
  for (const m of S.chat) {
    if (m.kind === 'sep') { log.append(el('div', { class: 'sep' }, m.content)); continue; }
    const body = m.thinking ? (S.chat.some(x => x === m) && m.photo ? '사진 속 음식을 살펴보는 중…' : '기록을 정리하는 중…') : (m.thumb ? m.content.replace('\n[사진 첨부]', '') : m.content);
    const bubble = el('div', { class: `msg ${m.role === 'user' ? 'me' : 'ai'}${m.thinking ? ' thinking' : ''}${m.thumb && !body ? ' photo-only' : ''}` });
    if (m.thumb) bubble.append(el('img', { src: m.thumb, alt: '올린 사진' }));
    bubble.append(body); log.append(bubble);
    if (m.saved?.length && !m.undone) {
      const row = el('div', { class: 'saved' }, '기록함', ...m.saved.map(s => el('span', {}, s)));
      if (undoMap.has(m.id)) row.append(el('button', { onclick: () => undo(m) }, '되돌리기'));
      log.append(row);
    }
    (m.labs || []).forEach((v, i) => log.append(labCard(m, v, i)));
    if (m.note) log.append(el('div', { class: 'note' }, m.note));
    if (m === last && m.role === 'assistant' && m.chips?.length && !busy) {
      log.append(el('div', { class: 'chips' }, m.chips.map(c => el('button', { class: 'chip', onclick: () => toast('시연용 화면이에요') }, c))));
    }
  }
  log.scrollTop = log.scrollHeight;
}

function labCard(m, v, i) {
  const label = v.kind === 'retest' ? '재검 결과' : '기준 검사';
  const card = el('div', { class: 'lab' },
    el('h3', {}, `${label} ${md(v.date)} ${v.status === 'saved' ? '저장됨' : v.status === 'rejected' ? '저장 안 함' : '이 숫자가 맞나요?'}`),
    el('dl', {}, [['LDL', v.ldl, 'ldl'], ['HDL', v.hdl], ['중성지방', v.tg], ['총콜레스테롤', v.tc]].map(([k, val, c]) => el('div', {}, el('dt', {}, k), el('dd', { class: c || '' }, val ?? '–')))));
  if (v.status === 'pending') card.append(el('div', { class: 'row' },
    el('button', { class: 'btn primary', onclick: () => confirmLab(m, i) }, '맞아요, 저장'),
    el('button', { class: 'btn', onclick: () => { v.status = 'rejected'; save(); renderChat(); const t = $('#input'); t.value = `${label} 수치 다시 알려줄게요: `; t.focus(); } }, '다시 입력할게요')));
  return card;
}

// ---------- 기록 탭 ----------
function lineChart(pts, total, unit) {
  const w = 320, h = 130, px = 28, py = 14;
  const ys = pts.map(p => p.y); let lo = Math.min(...ys), hi = Math.max(...ys); if (hi - lo < 1) { lo -= 1; hi += 1; }
  const X = i => px + (w - px - 8) * (total <= 1 ? 0 : i / (total - 1)), Y = y => py + (h - py * 2) * (1 - (y - lo) / (hi - lo));
  const d = pts.map((p, k) => `${k ? 'L' : 'M'}${X(p.i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const lastP = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="체중 변화"><line x1="${px}" x2="${w - 8}" y1="${h - py}" y2="${h - py}" stroke="var(--line)"/><text x="0" y="${Y(hi) + 3}">${hi.toFixed(1)}</text><text x="0" y="${Y(lo) + 3}">${lo.toFixed(1)}</text><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(lastP.i)}" cy="${Y(lastP.y)}" r="3.5" fill="var(--accent)"/><text x="${Math.min(X(lastP.i) - 20, w - 50)}" y="${Y(lastP.y) - 8}" style="fill:var(--ink)">${lastP.y}${unit}</text></svg>`;
}
function barChart(vals) {
  const w = 320, h = 120, py = 16, gap = 6, n = vals.length, bw = (w - gap * (n - 1)) / n, mx = Math.max(150, ...vals);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="주별 운동 시간"><line x1="0" x2="${w}" y1="${h - py - (h - py * 2) * 150 / mx}" y2="${h - py - (h - py * 2) * 150 / mx}" stroke="var(--ldl)" stroke-dasharray="3 3"/><text x="${w - 50}" y="${h - py - (h - py * 2) * 150 / mx - 4}" style="fill:var(--ldl)">주 150분</text>${vals.map((v, i) => { const bh = (h - py * 2) * v / mx; return `<rect x="${i * (bw + gap)}" y="${h - py - bh}" width="${bw}" height="${Math.max(bh, 1)}" rx="2" fill="var(--accent)" opacity="${v ? 1 : .25}"/><text x="${i * (bw + gap) + bw / 2 - 6}" y="${h - 2}">${i + 1}주</text>`; }).join('')}</svg>`;
}

function renderRecords() {
  const s = $('#records'); s.textContent = '';
  s.append(guide('기록: 재검까지 쌓인 과정', '기준 검사일부터 재검일까지의 기록을 계산해서 보여줍니다. 기록의 밀도에서 관리가 비었던 기간을, 체중과 운동 그래프에서 흐름을 확인합니다.'));
  const p = period();
  if (!p) { s.append(emptyState('기준 검사 결과가 있어야 재검까지의 기록을 보여드릴 수 있어요.', '대화에서 검사 결과 알려주기')); return; }
  const end = S.retestDate || addDays(p.start, 83), span = Math.max(diff(p.start, end) + 1, p.total);
  s.append(el('h2', {}, '재검까지의 기록'), el('p', { class: 'sub' }, `${md(p.start)} 기준 검사부터 ${S.retestDate ? md(S.retestDate) + ' 재검까지' : '오늘까지'}`));
  const f = el('div', { class: 'panel facts' });
  const w0 = p.weights[0], w1 = p.weights[p.weights.length - 1];
  [['기록한 날', p.recDays, `/ ${p.total}일`], ['식사 기록', p.meals, '건'], ['주 평균 운동', p.weekly, '분'], ['체중 변화', w0 && w1 && w0 !== w1 ? (w1.kg - w0.kg > 0 ? '+' : '') + (w1.kg - w0.kg).toFixed(1) : '–', w0 ? 'kg' : '']]
    .forEach(([k, v, u]) => { const st = el('strong', {}, String(v)); st.append(el('em', {}, u)); f.append(el('div', { class: 'fact' }, el('small', {}, k), st)); });
  s.append(f);

  s.append(el('h2', {}, '기록의 밀도'), el('p', { class: 'sub' }, '하루에 식사·운동·체중 중 몇 가지를 남겼는지'));
  const g = el('div', { class: 'grid' }), t = today();
  for (let i = 0; i < span; i++) {
    const d = addDays(p.start, i), L = S.logs[d];
    const lv = L ? [L.meals.length > 0, L.exercise.length > 0, L.weight != null].filter(Boolean).length : 0;
    const cls = ['cell', d > t ? 'future' : 'l' + lv, d === S.retestDate ? 'retest' : '', d === t ? 'today' : ''].join(' ');
    g.append(el('div', { class: cls, title: `${md(d)} ${lv}가지 기록` }));
  }
  const lg = el('div', { class: 'legend' }, el('span', {}, el('i', { style: 'background:var(--accent);opacity:.35' }), '1가지'), el('span', {}, el('i', { style: 'background:var(--accent)' }), '3가지'), el('span', {}, el('i', { style: 'outline:2px solid var(--ldl)' }), '재검일'));
  s.append(el('div', { class: 'panel' }, g, lg));

  if (p.weights.length >= 2) {
    const c = el('div', { class: 'panel' }); c.innerHTML = lineChart(p.weights.map(x => ({ i: x.i, y: x.kg })), p.total, 'kg');
    s.append(el('h2', {}, '체중'), c);
  }
  const weeks = []; for (let i = 0; i < p.total; i++) { const L = S.logs[addDays(p.start, i)]; const wk = Math.floor(i / 7); weeks[wk] = (weeks[wk] || 0) + (L ? L.exercise.reduce((a, e) => a + e.minutes, 0) : 0); }
  if (p.exMin > 0) { const c = el('div', { class: 'panel' }); c.innerHTML = barChart(weeks.slice(-12)); s.append(el('h2', {}, '주별 운동 시간'), c); }

  const recent = Object.keys(S.logs).filter(d => S.logs[d].meals.length || S.logs[d].exercise.length || S.logs[d].weight != null).sort().reverse().slice(0, 10);
  if (recent.length) {
    const list = el('div', { class: 'panel' });
    recent.forEach(d => { const L = S.logs[d]; const ph = L.meals.filter(m => m.photo); list.append(el('div', { class: 'day' }, el('b', {}, md(d)),
      ph.length ? el('div', { class: 'day-photos' }, ph.map(m => el('figure', {}, el('img', { src: m.photo, alt: `${m.slot} 사진`, loading: 'lazy' }), el('figcaption', {}, m.slot)))) : null,
      L.meals.length ? el('p', {}, L.meals.map(m => `${m.slot} ${m.text}`).join(', ')) : null,
      L.exercise.length ? el('p', {}, L.exercise.map(e => `${e.text} ${e.minutes}분`).join(', ')) : null,
      L.weight != null ? el('p', {}, `체중 ${L.weight}kg`) : null)); });
    s.append(el('h2', {}, '최근 기록'), list);
  }
}

// ---------- 비교 탭 ----------

  const b = S.baseline, r = S.retest, p = period();

  });
  s.append(el('div', { class: 'panel' }, tb));
  s.append(el('h2', {}, '그 사이 나의 관리'));
  const w0 = p.weights[0], w1 = p.weights[p.weights.length - 1];
  const f = el('div', { class: 'panel facts' });
  [['기록한 날', `${Math.round(p.recDays / p.total * 100)}`, '%'], ['식사 기록', p.meals, '건'], ['주 평균 운동', p.weekly, '분'], ['체중', w0 && w1 ? `${w0.kg}→${w1.kg}` : '–', w0 ? 'kg' : '']]
    .forEach(([k, v, u]) => { const st = el('strong', {}, String(v)); st.append(el('em', {}, u)); f.append(el('div', { class: 'fact' }, el('small', {}, k), st)); });
  s.append(f, el('p', { class: 'sub', style: 'margin-top:12px' }, '수치 변화와 생활습관이 함께 나타난 것이며, 무엇이 원인인지는 이 기록만으로 판단할 수 없어요.'));
  s.append(el('div', { class: 'row', style: 'margin-top:8px' }, el('button', { class: 'btn primary', onclick: () => go('summary') }, '진료 요약 보기')));
}

// ---------- 진료 요약 탭 ----------
function factsText() {
  const p = period(); if (!p) return '';
  const b = S.baseline, r = S.retest, w0 = p.weights[0], w1 = p.weights[p.weights.length - 1];
  const lab = k => r ? `${b[k] ?? '–'} → ${r[k] ?? '–'}` : `${b[k] ?? '–'}`;
  return [`기간: ${md(p.start)} ~ ${md(p.end)} (${p.total}일)`,
    `LDL: ${lab('ldl')} / HDL: ${lab('hdl')} / 중성지방: ${lab('tg')} / 총콜레스테롤: ${lab('tc')}`,
    `기록: ${p.total}일 중 ${p.recDays}일, 식사 기록 ${p.meals}건`,
    `운동: 주 평균 ${p.weekly}분`, `체중: ${w0 && w1 ? `${w0.kg}kg → ${w1.kg}kg` : '기록 부족'}`].join('\n');
}

async function makeNarrative(btn) {
  if (!sample || aiOff) { toast('AI를 쓸 수 없는 환경이에요'); return; }
  const p = period(); btn.disabled = true; btn.textContent = '정리하는 중…';
  const meals = []; for (let i = 0; i < p.total; i++) { const d = addDays(p.start, i), L = S.logs[d]; if (L?.meals.length) meals.push(`${d}: ${L.meals.map(m => m.text).join(', ')}`); }
  const prompt = `아래는 LDL 재검을 앞둔 사용자가 직접 남긴 기록입니다. 의료진에게 보여줄 관리 과정 요약을 한국어로 4~5문장 작성하세요.
규칙: 관찰된 사실만 쓰세요. 식단의 반복 패턴(자주 먹은 음식, 기름진 식사 빈도 등), 운동 규칙성, 기록 공백 기간을 구체적으로. 수치 변화의 원인을 단정하지 말고 "~와 함께 나타났다"처럼 쓰세요. 약 복용에 대한 의견이나 권고는 쓰지 마세요. 제목·목록 없이 문단 하나.

[요약 수치]
${factsText()}

[식사 기록]
${meals.join('\n').slice(0, 9000)}`;
  try { const { text } = await sample(prompt, { modelTier: 'default', onText: ({ text }) => { const n = $('#narr'); if (n) n.textContent = text; } }); S.summary = { text, at: today() }; save(); }
  catch (e) { toast(e?.code === 'rate_limited' ? '요청이 몰렸어요. 잠시 뒤 다시 눌러주세요.' : '요약을 만들지 못했어요. 다시 눌러주세요.'); }
  renderSummary();
}

function renderSummary() {
  const s = $('#summary'); s.textContent = '';
  s.append(guide('진료 요약: 진료실에서 보여줄 한 장', '수치와 기록 통계는 계산으로 만들고, 관리 과정 문단은 AI가 식사 기록을 읽고 작성합니다. 대화 중 모은 질문이 함께 들어가 의료진과 구체적으로 상담할 수 있게 합니다.'));
  if (!S.baseline) { s.append(emptyState('기준 검사 결과가 있어야 요약을 만들 수 있어요.', '대화로 가기')); return; }
  const doc = el('div', { class: 'doc' });
  doc.append(el('h3', {}, '관리 기간과 수치'), ...factsText().split('\n').map(l => el('p', {}, l)));
  doc.append(el('h3', {}, '관리 과정'));
  const narr = el('p', { class: 'narr', id: 'narr' }, S.summary?.text || '아직 만들지 않았어요. 아래 버튼을 누르면 기록을 바탕으로 정리해요.');
  doc.append(narr);
  doc.append(el('h3', {}, '진료 때 물어볼 것'));
  if (S.questions.length) doc.append(el('ul', {}, S.questions.map((q, i) => el('li', {}, el('div', { class: 'q' }, el('span', {}, q), el('button', { onclick: () => { S.questions.splice(i, 1); save(); renderSummary(); } }, '빼기'))))));
  else doc.append(el('p', { style: 'color:var(--muted)' }, '대화 중에 약이나 치료 방향을 고민하면 여기에 모아둘게요.'));
  doc.append(el('p', { class: 'fine' }, '사용자가 직접 입력한 기록을 정리한 자료이며 진단이나 처방이 아닙니다.'));
  s.append(el('h2', {}, '진료용 요약'), el('p', { class: 'sub' }, '진료실에서 화면을 보여주거나 복사해 전달하세요'), doc);
  s.append(el('div', { class: 'row', style: 'margin-top:14px' },
        el('button', { class: 'btn', onclick: copySummary }, '텍스트 복사')));
}
async function copySummary() {
  const t = `[내식대로 관리 요약]\n${factsText()}\n\n${S.summary?.text || ''}\n\n진료 때 물어볼 것:\n${S.questions.map(q => '- ' + q).join('\n') || '- 없음'}\n\n※ 사용자가 직접 입력한 기록을 정리한 자료이며 진단이나 처방이 아닙니다.`;
  try { await navigator.clipboard.writeText(t); toast('복사했어요'); } catch (e) { toast('이 화면에서는 복사가 막혀 있어요'); }
}

async function makeThumb(f) {
  try { const bm = await createImageBitmap(f); const k = 160 / Math.max(bm.width, bm.height); const c = document.createElement('canvas'); c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k); c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .6); } catch (e) { return null; }
}
